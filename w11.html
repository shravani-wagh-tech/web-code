<!doctype html>
<html>
  <head>
    <title>Bootstrap Progress Bars</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
      <div class="container mt-5">
        <div class="progress mb-3">
        <div class="progress-bar-striped bg-success" style="width:40%">
          40% complete (success)
        </div>
        </div>
        <div class="progress mb-3">
        <div class="progress-bar-striped bg-info" style="width:50%">
          50% complete (info)
        </div>
        </div>
        <div class="progress mb-3">
        <div class="progress-bar-striped bg-warning" style="width:60%">
          60% complete (warning)
        </div>
        </div>
        <div class="progress mb-3">
        <div class="progress-bar-striped bg-danger" style="width:70%">
          70% complete (danger)
        </div>
        </div>
        </body>
        </html>
